# Attaches the build artifacts to the GitHub release semantic-release created,
# and writes the latest.json the updater reads.

name: Deploy

on:
  workflow_call:
    inputs:
      tag-name:
        description: Existing release tag to receive the installers.
        required: true
        type: string
      app-version:
        description: Version the updater manifest announces.
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup project
        uses: pixpilot/github-actions/setup-pnpm-project@v1

      # Each build keeps its own directory. The two macOS builds name their
      # tarball identically, and merging them into one directory would drop an
      # architecture before anything noticed.
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-*
          path: release-artifacts

      # Runs before the upload because it renames those macOS tarballs, and
      # latest.json has to name the files the release actually receives.
      #
      # Until a signing key is set up the bundler writes no .sig files and this
      # step fails, which is the intended answer: a manifest the updater would
      # refuse is worse than no manifest. Delete the step if you are not
      # shipping updates. See docs/updater.md.
      - name: Build the updater manifest
        run: >-
          pnpm exec tauri-updater-manifest release-artifacts
          --version "${{ inputs.app-version }}"
          --tag "${{ inputs.tag-name }}"
          --repository "${{ github.repository }}"
          --product-name "Tauri Template"

      - name: Attach installers to the release
        run: |
          mapfile -d '' files < <(
            find release-artifacts -type f \( \
              -name 'latest.json' -o \
              -name '*.AppImage' -o -name '*.AppImage.sig' -o \
              -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o \
              -name '*.deb' -o -name '*.deb.sig' -o \
              -name '*.dmg' -o -name '*.dmg.sig' -o \
              -name '*.exe' -o -name '*.exe.sig' -o \
              -name '*.msi' -o -name '*.msi.sig' -o \
              -name '*.rpm' -o -name '*.rpm.sig' \
            \) -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo '::error::No Tauri installers were downloaded.'
            exit 1
          fi

          gh release upload "${{ inputs.tag-name }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
